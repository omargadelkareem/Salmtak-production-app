name: salmtak
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+18

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_database: ^12.1.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  get_storage: ^2.1.1
  intl: ^0.20.2
  flutter_animate:
  iconsax_flutter:
  searchable_paginated_dropdown: ^1.3.0
  dropdown_search: ^6.0.2
  flutter_screenutil: ^5.9.3
  image_picker: ^1.1.2
 
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500

# ✅ مهم جدًا: خارج flutter
package_rename_config:
  android:
    package_name: "com.app.salmtak_doctor_app"
  ios:
    package_name: "com.app.salamtak.doctor"
    app_name: "Salamtak Doctor"